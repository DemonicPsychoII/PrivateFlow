name: Release
# A version tag builds the release on GitHub's runners from this repository's own sources, signs its checksum file with the release
# key and leaves a draft release with the package, its manifest, SHA256SUMS and SHA256SUMS.sig. The maintainer checks the draft and
# publishes it. Branches and pull requests never start this workflow. Only the "release" environment holds the signing key and the
# SignPath token, and it admits only version tags; the build job sees neither.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    name: Build the package
    if: github.repository == 'DemonicPsychoII/PrivateFlow' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    outputs:
      app-artifact-id: ${{ steps.app.outputs.artifact-id }}
    steps:
      # The whole history: the pure checks' tracked-text gate refuses a shallow checkout, which does not know every author.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Check the tag and its release notes
        shell: bash
        run: |
          python3 -I scripts/release.py check-tag "$GITHUB_REF_NAME"
          version="${GITHUB_REF_NAME#v}"; version="${version%%-*}"
          mkdir -p artifacts
          python3 -I scripts/release.py notes "$version" artifacts/release-notes.md
      - name: Build, check and assemble the app
        shell: bash
        run: bash scripts/build.sh --no-package
      - id: app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-unsigned
          path: artifacts/app
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 3

  release:
    name: Sign and draft the release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: artifacts
      # Authenticode signatures of Private Flow's own files by SignPath, once the release environment names a SignPath organization.
      - name: Sign own files with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          connector-url: https://githubactions.connector.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ needs.build.outputs.app-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/app
      - name: Take the unsigned app
        if: vars.SIGNPATH_ORGANIZATION_ID == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-unsigned
          path: artifacts/app
      - name: Package, manifest, checksums and their signature
        shell: bash
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          python3 -I scripts/package.py
          python3 -I scripts/release.py checksums artifacts/SHA256SUMS artifacts/PrivateFlow-win-x64.zip artifacts/manifest.json
          python3 -I scripts/release.py verify-checksums artifacts/SHA256SUMS artifacts/PrivateFlow-win-x64.zip artifacts/manifest.json
          python3 -I scripts/sign-checksums.py sign artifacts/SHA256SUMS artifacts/SHA256SUMS.sig
          # The signature must verify against the key install.ps1 pins, or no installed copy would accept the release.
          key=$(sed -n "s/^\$taskReleaseKey = '\([A-Za-z0-9+\/=]*\)'.*/\1/p" scripts/install.ps1)
          python3 -I scripts/sign-checksums.py verify artifacts/SHA256SUMS artifacts/SHA256SUMS.sig "$key"
      - name: Draft the release of the tag
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I scripts/release.py create-release "$GITHUB_REF_NAME" artifacts/release-notes.md artifacts/PrivateFlow-win-x64.zip artifacts/manifest.json artifacts/SHA256SUMS artifacts/SHA256SUMS.sig --draft
